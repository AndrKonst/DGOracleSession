settings.hint=<html>Detail queries can reference any column of the row selected in the tab grid as <b>:column_name</b>, e.g. <b>:sid</b>, <b>:serial#</b>, <b>:sql_id</b>. Text mode shows rows separated by new lines. Kill and Disconnect are available in tabs whose result has SID and SERIAL# columns.<br>In Table mode, cells of <b>HTML columns</b> show icons instead of the text to open the value in DataGrip or in the browser, or to copy it to the clipboard, e.g. a <b>dbms_sqltune.report_sql_monitor</b> report. If DataGrip loaded a value partially (LOB size limit), the detail query is re-executed and the row is found by <b>Row key columns</b>, e.g. <b>sql_id, sql_exec_id</b>.</html>
